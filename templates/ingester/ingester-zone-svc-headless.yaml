{{- if and .Values.ingester.enabled .Values.ingester.zoneAwareness.enabled -}}
{{- range $zone := .Values.ingester.zoneAwareness.zones }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cortex.ingesterFullname" $ }}-headless-{{ $zone.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "cortex.ingesterLabels" $ | nindent 4 }}
    zone: {{ $zone.name }}
    {{- with $.Values.ingester.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- toYaml $.Values.ingester.service.annotations | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ $.Values.config.server.grpc_listen_port }}
      protocol: TCP
      name: grpc
      targetPort: grpc
  selector:
    {{- include "cortex.ingesterSelectorLabels" $ | nindent 4 }}
    zone: {{ $zone.name }}
{{- end }}
{{- end -}}
